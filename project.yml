name: YouTubeWatch
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "8.0"
targets:
  YouTubeWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "8.0"
    sources:
      - path: ContentView.swift
      - path: YouTubeWatchApp.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.youtubewatch.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: YouTubeWatch
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.youtubewatch
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
