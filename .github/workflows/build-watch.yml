name: Build YouTubeWatch App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Watch App
        run: |
          xcodebuild \
            -project YouTubeWatch.xcodeproj \
            -scheme "YouTubeWatch Watch App" \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package build output
        run: |
          mkdir -p build_output
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -exec cp -R {} build_output/ \;
          zip -r watch-build.zip build_output

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-watch-build
          path: watch-build.zip
